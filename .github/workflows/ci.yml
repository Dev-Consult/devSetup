name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check Lint & Formatting (Biome)
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Run UI tests (Vitest)
        run: pnpm test:ui

      - name: Run Rust tests
        run: |
          cd src-tauri
          cargo test

      - name: Run Clippy
        run: |
          cd src-tauri
          cargo clippy -- -D warnings
