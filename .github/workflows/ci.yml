name: CI & Cross-Platform Desktop Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install mise CLI
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Ensure clippy is installed
        run: rustup component add clippy || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check Lint & Formatting (Biome)
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Run UI tests (Vitest)
        run: pnpm test:ui

      - name: Run Rust tests
        run: |
          cd src-tauri
          cargo test

      - name: Run Clippy
        run: |
          rustup component add clippy || true
          cd src-tauri
          cargo clippy -- -D warnings

  build-desktop:
    name: Build (${{ matrix.os_name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            os_name: "linux-x86_64"
          - platform: "macos-latest"
            os_name: "macos-universal"
          - platform: "windows-latest"
            os_name: "windows-x64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Desktop Application (Linux / Windows)
        if: matrix.platform != 'macos-latest'
        run: pnpm tauri build

      - name: Build Desktop Application (macOS Universal)
        if: matrix.platform == 'macos-latest'
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload Linux Artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: mise-desktop-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/tauri-app
          if-no-files-found: warn

      - name: Upload macOS Artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mise-desktop-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mise-desktop-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/tauri-app.exe
          if-no-files-found: warn
